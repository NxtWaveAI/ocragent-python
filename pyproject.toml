[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nxtwaveai-ocr"
version = "1.0.1"
description = "Official Python SDK for OCR Agent — extract structured data from documents using AI"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "NxtwaveAI", email = "hello@nxtwaveai.com" }]
keywords = ["ocr", "document", "extraction", "ai", "invoice", "pdf", "nxtwaveai"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"
dependencies = ["httpx>=0.24.0"]

[tool.hatch.build.targets.wheel]
packages = ["ocragent"]

[project.urls]
Homepage = "https://ocr.nxtwaveai.com"
Documentation = "https://ocr.nxtwaveai.com/settings/api-docs"
Repository = "https://github.com/nxtwaveai/ocragent-python"
